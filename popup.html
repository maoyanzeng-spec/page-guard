<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Player</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header class="header">
    <span class="header-icon">🎬</span>
    <span class="header-title">Clean Player</span>
    <button class="refresh-btn" id="refreshBtn" title="Rescan">↻</button>
  </header>

  <section class="list-section">
    <ul class="video-list" id="videoList"></ul>

    <div class="empty" id="emptyState" hidden>
      <span class="empty-icon">🔍</span>
      <p>No video detected yet.</p>
      <p class="empty-hint">Start playing the video on the page, then reopen this popup.</p>
    </div>
  </section>

  <footer class="footer">
    <span id="footStatus"></span>
  </footer>

  <script src="vendor/hls.light.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
